#
# This file is parsed by the create_tflm_arduino.py script using
# https://docs.python.org/3/library/configparser.html
#
# Section names are case insensitive and contain white space characters.
# Key names may not contain white space, and are case sensitive.
# Values for keys can span multiple lines (one value per line).
# Either # or ; can be used as a comment character, however there are
# no inline comments allowed 
#
# The following sections are required:
#   DEFAULT
#   Add Files
#   Remove Files
# All other sections are optional, and represent special operations
# that can be performed on repository or base directory files.  The
# optional sections can be of any unique name, and are executed in
# alphanumeric order.  Optional sections without keys are not allowed.
#
# Optional sections containing the <sed_scripts> key must also contain
# the <files> key.  The <files> key here is required to have one or more
# values.  The values represent files in the output directory.
# The values can be files or directory paths or shell glob expressions.
# The <sed_scripts> value is required to contain one or more SED
# (Stream EDitor) scripts, with one script per line.
# All SED scripts are applied to all specified files.
#
# Optional sections not containing the above previously documented keys are
# required to contain either the <from_repo> or <from> key, and the value of
# that key must not be empty.  The <from_repo> value represents a file in the
# repository, and the <from> value represents a file in the base directory.
# Furthermore, the section must contain the <to> key, and the value of that
# key must not be empty.  The <to> value represents the file in the output
# directory. Files are copied from the repository or base directory to the
# output directory, with some platform specific transformation of the file
# contents.

#
# Required section.
#
# Currently empty, but can be used to specify default key-values for all
# other sections.
#
[DEFAULT]
# currently empty

#
# Required section.
#
# The <files> key is required, however the value is allowed to be empty.
# The <files> values are the files in the repository that will be copied
# without modification to the output directory.  The value may be either
# a file or directory path.
#
[Add Files]
files =
    library.properties
    src/TensorFlowLite.h
    src/tensorflow/lite/micro/system_setup.cpp
    src/tensorflow/lite/micro/system_setup.h
    src/tensorflow/lite/micro/debug_log.cpp
    src/tensorflow/lite/micro/micro_time.cpp
    src/tensorflow/lite/micro/arduino_cmsis_nn_config.h

#
# Required section.
#
# The <files> key is required, however the value is allowed to be empty.
# The <files> values are the files in the base directory that will not
# be copied to the output directory.  The value may be either a file or
# directory path.
#
[Remove Files]
files =
    tensorflow/lite/micro/system_setup.cc
    tensorflow/lite/micro/cortex_m_generic/debug_log.cc
    tensorflow/lite/micro/cortex_m_generic/debug_log_callback.h
    tensorflow/lite/micro/cortex_m_generic/micro_time.cc
    tensorflow/lite/micro/models/
    examples/hello_world/hello_world_test.cc
    third_party/kissfft/kiss_fft.c
    third_party/kissfft/kiss_fftr.c

#
# patch base.h to include <utility> instead of <utility.h> and to always
# include <cstdint> (the ARDUINO guard predates 32-bit cores)
#
[patch flatbuffers]
files =
    src/third_party/flatbuffers/include/flatbuffers/base.h
sed_scripts =
    's/utility\.h/utility/'
    '/^#ifndef ARDUINO$/{N;s/#ifndef ARDUINO\n#include <cstdint>/#if 1\n#include <cstdint>/;}'

#
# patch kiss_fft wrapper include lines to have the correct path prefix
#
[patch kiss_fft wrappers]
files =
    signal/src/kiss_fft_wrappers/*.cpp
sed_scripts =
    's@#if __has_include("kiss_fftr.c")@#if 1@'
    's@\(.*#include.*"\)\(.*\)\.c"@\1third_party/kissfft/\2.inc"@'

#
# add an include guard to _kiss_fft_guts.h; kiss_fft.c and kiss_fftr.c both
# include it into the same namespace in the signal wrappers
#
[patch kissfft guts guard]
files =
    src/third_party/kissfft/_kiss_fft_guts.h
sed_scripts =
    '1i #ifndef KISS_FFT_GUTS_H_\n#define KISS_FFT_GUTS_H_'
    '$a #endif  // KISS_FFT_GUTS_H_'

#
# Arduino compiles every .c file in src/, but the kiss_fft wrappers include
# these sources into per-type namespaces. Rename them so they are only
# #included, otherwise the linker reports multiple definitions.
#
[rename kiss_fft.c]
from = third_party/kissfft/kiss_fft.c
to = src/third_party/kissfft/kiss_fft.inc

[rename kiss_fftr.c]
from = third_party/kissfft/kiss_fftr.c
to = src/third_party/kissfft/kiss_fftr.inc

#
# The signal wrappers include kiss_fft into per-type namespaces. extern "C"
# ignores namespaces, so all variants would export the same symbols and the
# linker reports multiple definitions. Use C++ linkage instead.
#
[patch kissfft linkage]
files =
    src/third_party/kissfft/kiss_fft.h
    src/third_party/kissfft/kiss_fftr.h
sed_scripts =
    's@^#ifdef __cplusplus$@#if 0  /* no extern "C": see create_tflm_arduino MANIFEST.ini */@'


#
# CMSIS-NN is merged next to the reference kernels (see MERGE_KERNEL_DIRS in
# config.env). Arduino compiles every file in src/, so each file of one variant
# is wrapped in #if on CMSIS_NN, which arduino_cmsis_nn_config.h defines for
# Arm cores with the DSP or MVE extension and GCC 12 or newer. Exactly one variant of each kernel
# is therefore compiled.
#
[cmsis_nn guard reference kernels]
files =
    src/tensorflow/lite/micro/kernels/add.cpp
    src/tensorflow/lite/micro/kernels/batch_matmul.cpp
    src/tensorflow/lite/micro/kernels/conv.cpp
    src/tensorflow/lite/micro/kernels/depthwise_conv.cpp
    src/tensorflow/lite/micro/kernels/fully_connected.cpp
    src/tensorflow/lite/micro/kernels/maximum_minimum.cpp
    src/tensorflow/lite/micro/kernels/mul.cpp
    src/tensorflow/lite/micro/kernels/pad.cpp
    src/tensorflow/lite/micro/kernels/pooling.cpp
    src/tensorflow/lite/micro/kernels/softmax.cpp
    src/tensorflow/lite/micro/kernels/svdf.cpp
    src/tensorflow/lite/micro/kernels/transpose.cpp
    src/tensorflow/lite/micro/kernels/transpose_conv.cpp
    src/tensorflow/lite/micro/kernels/unidirectional_sequence_lstm.cpp
sed_scripts =
    '1i #include "tensorflow/lite/micro/arduino_cmsis_nn_config.h"\n#if !defined(CMSIS_NN)'
    '$a #endif  // !defined(CMSIS_NN)'

[cmsis_nn guard cmsis kernels]
files =
    src/tensorflow/lite/micro/kernels/cmsis_nn/add.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/batch_matmul.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/conv.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/depthwise_conv.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/fully_connected.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/maximum_minimum.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/mul.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/pad.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/pooling.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/softmax.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/svdf.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/transpose.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/transpose_conv.cpp
    src/tensorflow/lite/micro/kernels/cmsis_nn/unidirectional_sequence_lstm.cpp
sed_scripts =
    '1i #include "tensorflow/lite/micro/arduino_cmsis_nn_config.h"\n#if defined(CMSIS_NN)'
    '$a #endif  // defined(CMSIS_NN)'

#
# The kernel headers and the profiler test CMSIS_NN, so they need the config
# first.
#
[cmsis_nn config include]
files =
    src/tensorflow/lite/micro/kernels/add.h
    src/tensorflow/lite/micro/kernels/batch_matmul.h
    src/tensorflow/lite/micro/kernels/conv.h
    src/tensorflow/lite/micro/kernels/depthwise_conv.h
    src/tensorflow/lite/micro/kernels/fully_connected.h
    src/tensorflow/lite/micro/kernels/maximum_minimum.h
    src/tensorflow/lite/micro/kernels/mul.h
    src/tensorflow/lite/micro/kernels/pad.h
    src/tensorflow/lite/micro/kernels/pooling.h
    src/tensorflow/lite/micro/kernels/softmax.h
    src/tensorflow/lite/micro/kernels/svdf.h
    src/tensorflow/lite/micro/kernels/transpose.h
    src/tensorflow/lite/micro/kernels/transpose_conv.h
    src/tensorflow/lite/micro/kernels/unidirectional_sequence_lstm.h
    src/tensorflow/lite/micro/micro_profiler.cpp
sed_scripts =
    '0,/^#include/s@^#include@#include "tensorflow/lite/micro/arduino_cmsis_nn_config.h"\n#include@'

#
# The CMSIS-NN sources include each other by bare name, which only works with
# -I on the Include folder. Use full paths from src/ and guard each file.
#
[cmsis_nn sources]
files =
    src/third_party/cmsis_nn/Source/*/*.c
sed_scripts =
    's@#include "\(arm_[A-Za-z0-9_]*\.h\)"@#include "third_party/cmsis_nn/Include/\1"@'
    's@#include "Internal/@#include "third_party/cmsis_nn/Include/Internal/@'
    '1i #include "tensorflow/lite/micro/arduino_cmsis_nn_config.h"\n#if defined(CMSIS_NN)'
    '$a #endif  // defined(CMSIS_NN)'

#
# The sketch template is stored as .ino.in: the Library Manager lint rejects
# sketches outside examples/ and extras/ (rule LD003).
#
[hello_world sketch]
from_repo = examples/hello_world/hello_world.ino.in
to = examples/hello_world/hello_world.ino
